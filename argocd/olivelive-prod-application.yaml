apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olivelive-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/psehyun1075/olivlive.git
    targetRevision: feat/integration
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: olivelive
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true