apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalog-service
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - olivelive
  selector:
    matchLabels:
      app: catalog-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s

