server:
  port: 8080

spring:
  application:
    name: live-control-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/livecontrol}
    username: ${DB_USERNAME:livecontrol}
    password: ${DB_PASSWORD:livecontrol}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
